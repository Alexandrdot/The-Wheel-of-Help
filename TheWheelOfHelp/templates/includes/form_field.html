<div class="form-field{% if field.field.widget.input_type == 'checkbox' %} form-field--checkbox{% endif %}{% if field.errors %} form-field--error{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
        <label class="form-field__checkbox" for="{{ field.id_for_label }}">
            {{ field }}
            <span>{{ field.label }}</span>
        </label>
    {% else %}
        <label class="form-field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
    {% endif %}
    {% if field.help_text %}
        <p class="form-field__hint">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
        <ul class="form-field__errors">
            {% for error in field.errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</div>
