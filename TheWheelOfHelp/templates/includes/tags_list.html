{% if tags %}
<section class="sidebar-section">
    <h2 class="sidebar-heading">Теги</h2>
    <div class="sidebar-tags">
        {% for tag in tags %}
            <a class="sidebar-tag" href="{% url 'homepage:tag_detail' tag.slug %}">{{ tag.name }}</a>
        {% endfor %}
    </div>
</section>
{% endif %}
