<header class="header">
    <div class="header__inner">
        <a class="header-brand" href="{% url 'homepage:index' %}">TheWheelOfHelp</a>

        <nav class="header-nav" aria-label="Главное меню">
            <ul class="header-nav__list">
                {% for m in mainmenu %}
                    <li><a href="{{ m.url }}">{{ m.title }}</a></li>
                {% endfor %}
            </ul>
        </nav>

        <form class="header-search" method="get" action="{% url 'homepage:search' %}" role="search">
            <input class="header-search__input" type="search" name="q" value="{{ request.GET.q|default:'' }}"
                   placeholder="Поиск услуг..." aria-label="Поиск">
            <button class="header-search__btn" type="submit" aria-label="Найти">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
        </form>

        <div class="header-account">
            {% if user.is_authenticated %}
                <a class="header-profile" href="{% url 'users:profile' %}">
                    {% if user.photo %}
                        <img class="header-profile__avatar" src="{{ user.photo.url }}" alt="{{ user.username }}">
                    {% else %}
                        <img class="header-profile__avatar" src="{{ default_user_image }}" alt="{{ user.username }}">
                    {% endif %}
                    <span class="header-profile__name">{{ user.username }}</span>
                </a>
                <form class="header-logout" method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="header-logout__btn" title="Выйти">Выйти</button>
                </form>
            {% else %}
                <div class="header-guest">
                    <a href="{% url 'users:login' %}">Войти</a>
                    <span class="header-guest__sep">|</span>
                    <a href="{% url 'users:register' %}">Регистрация</a>
                </div>
            {% endif %}
        </div>
    </div>
</header>
