{% extends 'base.html' %}

{% block content %}
<h1>Загрузка файла на сервер</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <div class="form-group">
        {{ form.file.label_tag }}
        {{ form.file }}
        {% if form.file.errors %}
            <div class="form-error">{{ form.file.errors }}</div>
        {% endif %}
    </div>
    
    <button type="submit" class="btn-submit">Загрузить</button>
</form>

<p><a href="{% url 'homepage:index' %}">← На главную</a></p>
{% endblock %}
