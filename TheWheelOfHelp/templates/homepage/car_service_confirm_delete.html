{% extends 'base.html' %}

{% block content %}
    <h1>Удаление услуги</h1>
    <p>Удалить запись <strong>{{ object.title }}</strong>? Действие необратимо.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-submit">Удалить</button>
        <a href="{{ object.get_absolute_url }}">Отмена</a>
    </form>
{% endblock %}
