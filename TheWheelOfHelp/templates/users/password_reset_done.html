{% extends 'base.html' %}

{% block content %}
<div class="form-page form-page--narrow auth-page">
    <div class="auth-card">
        <header class="page-header page-header--center">
            <h1 class="page-title">Письмо отправлено</h1>
        </header>

        <div class="form-panel form-panel--info">
            <p class="auth-message">
                Если аккаунт с указанным E-mail существует, мы отправили инструкции по восстановлению пароля.
            </p>
            <p class="auth-message auth-message--muted">
                Письмо может прийти в течение нескольких минут. Проверьте папку «Спам», если не видите его во входящих.
            </p>
        </div>

        <footer class="auth-card__footer">
            <a class="btn-secondary" href="{% url 'users:login' %}">На страницу входа</a>
        </footer>
    </div>
</div>
{% endblock %}
