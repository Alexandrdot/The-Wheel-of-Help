{% extends 'base.html' %}

{% block content %}
<div class="form-page form-page--narrow auth-page">
    <div class="auth-card">
        <header class="page-header page-header--center">
            <h1 class="page-title">Пароль изменён</h1>
        </header>

        <div class="form-panel form-panel--success">
            <p class="form-success__text">
                Пароль успешно обновлён. Теперь вы можете войти с новым паролем.
            </p>
        </div>

        <footer class="auth-card__footer">
            <a class="btn-primary" href="{% url 'users:login' %}">Войти в систему</a>
            <a class="btn-secondary" href="{% url 'homepage:index' %}">На главную</a>
        </footer>
    </div>
</div>
{% endblock %}
